<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to Future School.">
  <title>Login | Future School</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <a class="brand login-brand" href="index.html"><span class="brand-mark" aria-hidden="true">F</span> Future School</a>
      <h1>Sign in</h1>
      <form class="login-form">
        <div class="form-field">
          <label for="login-email">Email address</label>
          <input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="form-field">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        </div>
        <button class="button button-primary login-submit" type="button">Sign In</button>
      </form>
      <p class="demo-note">Demo only. Sign-in is not connected to an account.</p>
      <a class="back-link" href="index.html"><span aria-hidden="true">←</span> Back to home</a>
    </section>
    <p class="login-footer">Curious minds. Bright futures.</p>
  </main>
</body>
</html>
